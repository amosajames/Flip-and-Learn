<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flip & Learn</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#223a35;font:17px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 22px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;letter-spacing:-1px;margin:0}.badge{font-size:12px;background:#e6eadb;padding:8px 12px;border-radius:30px}p{color:#68766e}label{font-size:12px;font-weight:700;letter-spacing:1.5px}select{display:block;width:100%;margin:10px 0 24px;border:1px solid #cbd1c5;border-radius:12px;background:white;padding:15px;color:#223a35;font:inherit}.meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;color:#68766e}#card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;width:100%;min-height:320px;padding:35px;border:1px solid #dae0d5;border-radius:24px;background:#fff;box-shadow:0 12px 35px #223a3509;color:inherit;cursor:pointer;transition:background .2s;text-align:center}#card.answer{background:#e4eddc}#side{text-transform:uppercase;font:700 11px system-ui;letter-spacing:2px;color:#688063}#text{font:500 clamp(23px,4vw,32px)/1.4 system-ui;max-width:560px}#hint{font:13px system-ui;color:#73816e}.nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:20px}button.control{border:1px solid #cbd1c5;border-radius:12px;background:transparent;color:#223a35;padding:15px 8px;font:600 15px system-ui;cursor:pointer}button.primary{background:#294d40;color:white;border-color:#294d40}button:focus-visible,select:focus-visible{outline:3px solid #d28c44;outline-offset:4px}footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px}footer button{font:14px system-ui;border:0;background:none;color:#365d4a;cursor:pointer;padding:10px}footer span{font-size:12px;color:#788176}@media(max-width:450px){main{padding-top:24px}.badge{font-size:10px}#card{min-height:350px;padding:24px}footer span{max-width:150px;text-align:right}}body{background:linear-gradient(145deg,#d8f3e5,#e7ddff);color:#25464a}main{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;padding: max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}#card{flex:1;min-height:240px;background:#fffdf5;border:3px solid #9bcdb7}#text{font-size:clamp(26px,5vw,48px);font-weight:750}#reward{background:#f9cf70;color:#3c3520;border:0;border-radius:16px;padding:14px;font:700 18px system-ui;margin-top:10px}#party{position:fixed;inset:0;background:#e5f7dbf5;display:grid;place-content:center;text-align:center;z-index:9;font-size:32px;font-weight:bold}#party[hidden],#reward[hidden]{display:none}#fox{width:190px;margin:auto;animation:dance .45s ease-in-out infinite alternate}@keyframes dance{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-30px) rotate(15deg)}}@media(prefers-reduced-motion:reduce){#fox{animation:none}} .selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selectors select{margin:6px 0 12px;padding:10px;font-size:15px}@media(max-width:380px){.selectors select{font-size:13px;padding:8px}} #petPanel{display:flex;align-items:center;gap:12px;background:#ffffffa8;border-radius:18px;padding:8px 14px;margin-bottom:10px}#petArt{width:88px;flex-shrink:0}#petArt svg,#fox svg{width:100%;display:block}.petInfo{flex:1;font-size:13px}progress{width:100%;accent-color:#39876b}#sanctuary,#wrong{border:0;background:transparent;color:#285b49;padding:8px;font:600 14px system-ui}#wrong[hidden]{display:none}dialog{border:0;border-radius:22px;max-width:90vw;width:500px;background:#fffdf5;color:#25464a}dialog::backdrop{background:#193a3677}.animals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.animalTile{text-align:center;background:#e6f2e8;border-radius:15px;padding:8px}.animalTile svg{width:90px;display:block;margin:auto}#fox{width:220px}#party{padding:20px}#partyMessage{font-size:24px} </style></head><body><main><header><h1>Flip & Learn Plus<span style="color:#c99452"> ✦</span></h1><span class="badge" id="grade">GRADES 5–6</span></header><p>Grow your knowledge. Raise your animal.</p><div class="selectors"><div><label for="subject">CHOOSE A SUBJECT</label><select id="subject"></select></div><div><label for="level">GRADE LEVEL</label><select id="level"><option value="4" >Grade 4</option><option value="5" >Grade 5</option><option value="6" selected>Grade 6</option><option value="7" >Grade 7</option><option value="8" >Grade 8</option><option value="9" >Grade 9</option><option value="10" >Grade 10</option></select></div></div><section id="petPanel"><div id="petArt"></div><div class="petInfo"><strong id="petName"></strong><div id="petProgress"></div><progress id="growth" max="50" value="0"></progress><button id="sanctuary">Animal sanctuary</button></div></section><div class="meta"><span id="category"></span><span id="count"></span></div><button id="card" aria-label="Show answer"><span id="side"></span><span id="text"></span><span id="hint"></span></button><div class="nav"><button class="control" id="prev">← Previous</button><button class="control primary" id="flip">Show answer</button><button class="control" id="next">Next →</button></div><button id="reward" hidden>I got it right! ★</button><button id="wrong" hidden>Practice this again</button><footer><button id="shuffle">⇄ Shuffle cards</button><span>Tap to flip · Arrow keys to browse</span></footer></main><dialog id="zoo"><h2>Your animal sanctuary</h2><div class="animals" id="zooList"></div><button class="control" id="closeZoo">Close</button></dialog><div id="party" hidden role="status"><div id="fox"></div><div id="partyMessage">Fantastic! ★</div></div><script>
const decks={};function add(name,rows){decks[name]=rows.trim().split('\n').map(r=>r.split('|'))}
add('Science facts',`What is the basic unit of living things?|A cell.
What is photosynthesis?|Plants use sunlight, water, and carbon dioxide to make sugar, releasing oxygen.
What do roots do?|Absorb water and minerals and anchor a plant.
What is a vertebrate?|An animal with a backbone.
What is an invertebrate?|An animal without a backbone.
What is an adaptation?|An inherited characteristic that helps an organism survive and reproduce.
What do lungs do?|Take in oxygen and remove carbon dioxide.
What does the heart do?|Pumps blood throughout the body.
What is an ecosystem?|Living things and their nonliving environment interacting.
What is a producer?|An organism that makes its own food.
What is a consumer?|An organism that gets energy by eating other organisms.
What is a decomposer?|An organism that breaks down dead material and waste.
What do food-chain arrows show?|The direction energy moves, from food to eater.
What is a food web?|A network of connected food chains.
What is a habitat?|The place an organism lives.
What powers most ecosystems?|The Sun.
What is matter?|Anything that has mass and takes up space.
What are three common states of matter?|Solid, liquid, and gas.
Mass versus weight?|Mass measures matter; weight measures gravity’s pull.
What is a physical change?|A change that does not make a new substance, such as melting ice.
What is a chemical change?|A change producing new substances, such as rusting.
What is conduction?|Heat transfer through direct contact.
What is a force?|A push or pull.
What is gravity?|Attraction between objects with mass.
What is friction?|A force resisting surfaces sliding past each other.
How do you find average speed?|Distance ÷ time.
What do balanced forces do?|Leave motion unchanged: still, or constant speed and direction.
What is an electrical conductor?|A material that lets current flow easily, such as copper.
What is an electrical insulator?|A material that resists current, such as rubber.
What does a simple circuit need?|An energy source and a closed conducting path.
What causes day and night?|Earth’s rotation.
What causes seasons?|Earth’s tilted axis as Earth orbits the Sun.
Why does the Moon show phases?|We see different amounts of its sunlit half as it orbits Earth.
What are the three main rock types?|Igneous, sedimentary, and metamorphic.
Weathering versus erosion?|Weathering breaks rock down; erosion moves it.
What are tectonic plates?|Slowly moving pieces of Earth’s rigid outer layer.`);

add('Periodic table',`What is the periodic table?|A chart organizing elements by atomic number.
What is an element?|A pure substance made of one type of atom.
What is an atom?|The smallest unit retaining an element’s chemical identity.
What does atomic number tell you?|The number of protons in an atom.
What is a chemical symbol?|A one- or two-letter abbreviation for an element.
What are horizontal rows called?|Periods.
What are vertical columns called?|Groups or families.
Why are elements in a group similar?|Their outer electron arrangements usually give them similar chemical properties.
Where are most metals?|On the left and in the center.

add('Algebra practice',`What is a solution?|A number that makes an equation true.
What is the main rule for solving equations?|Do the same operation to both sides.
What undoes addition?|Subtraction.
What undoes subtraction?|Addition.
What undoes multiplication?|Division by the same nonzero number.
What undoes division?|Multiplication by the same nonzero number.
Solve x + 5 = 12.|x = 7. Subtract 5 from both sides.
Solve x − 4 = 9.|x = 13. Add 4 to both sides.
Solve 3x = 18.|x = 6. Divide both sides by 3.
Solve x ÷ 4 = 5.|x = 20. Multiply both sides by 4.
Solve 2x + 4 = 14.|x = 5. Subtract 4, then divide by 2.
How do you check a solution?|Substitute it into the original equation and check both sides are equal.`);
add('Math terms',`Sum|The answer to addition: 4 + 3 = 7.
Difference|The answer to subtraction: 9 − 5 = 4.
Product|The answer to multiplication: 3 × 4 = 12.
Quotient|The answer to division: 12 ÷ 3 = 4.
Factor|A number multiplied by another to make a product. 3 and 4 are factors of 12.
Multiple|A number made by multiplying by a whole number: 5, 10, 15 are multiples of 5.
Remainder|The amount left in whole-number division: 14 ÷ 4 is 3 remainder 2.
Variable|A letter representing a number, such as x.
Constant|A fixed value: 3 in x + 3.
Coefficient|A number multiplying a variable: 5 in 5x.
Term|A part separated by addition or subtraction: 3x and 7 in 3x + 7.
Expression|Numbers, variables, or operations representing a value: 2x + 5.
Equation|A statement that two expressions are equal: 2x + 5 = 13.
Solution|A value making an equation true: x = 4 solves 2x + 5 = 13.
Evaluate|Find the value. If x = 3, then 2x + 1 = 7.
Inequality|A comparison using <, >, ≤, or ≥.
Equivalent|Having the same value: 1/2 and 2/4.
Inverse operations|Operations that undo each other.
Numerator|The top number in a fraction: 3 in 3/4.
Denominator|The bottom number: how many equal parts make one whole.
Percent|A number out of 100: 25% = 1/4.
Ratio|A comparison of quantities: 2 red to 3 blue is 2:3.
Prime number|A whole number greater than 1 with exactly two positive factors: 1 and itself.
Composite number|A whole number greater than 1 with more than two positive factors.
Exponent|Tells how many times to use a base as a factor: 2³ = 2 × 2 × 2.
Absolute value|Distance from zero: the absolute value of −5 is 5.
Distributive property|3(x + 2) = 3x + 6.
Commutative property|Changing order preserves a sum or product: 3 + 5 = 5 + 3.
Associative property|Changing grouping preserves a sum or product.
Order of operations|Parentheses, exponents, multiplication/division left to right, then addition/subtraction left to right.`);
add('Scientific results',`Scientific question|A question you can investigate with observations or experiments.
Hypothesis|A possible explanation that can be tested.
Prediction|What you expect to happen.
Experiment|A procedure testing a hypothesis or question.
Variable|Something that can change in an investigation.
Independent variable|The factor deliberately changed.
Dependent variable|The result measured.
Controlled variables|Factors kept the same.
Control group|A comparison group receiving standard conditions or no treatment.
Observation|Information gathered with senses or tools.
Measurement|A number and unit, such as 15 centimeters.
Data|Collected observations and measurements.
Qualitative data|Descriptions, such as color or texture.
Quantitative data|Numbers, such as height or time.
Results|What happened, shown through observations and data.
Graph|A visual display of data.
Trend|A general pattern in data.
Evidence|Data supporting or challenging an explanation.
Conclusion|An answer based on results.
Repeated trials|Performing a test more than once to check consistency.
Mean (average)|Add values and divide by the number of values.
Accuracy|Closeness to the true or accepted value.
Precision|Closeness of repeated measurements to each other.
Inference|An explanation based on observations and prior knowledge.
Do results prove a hypothesis forever?|No. Results can support or fail to support it; one experiment does not establish it for all situations.`);
add('Weather & temperature',`What is weather?|Atmospheric conditions at a place and time.
What is temperature?|A measure of how hot or cold something is.
What measures temperature?|A thermometer.
Common temperature scales?|Celsius (°C) and Fahrenheit (°F).
Water’s freezing temperature?|About 0°C or 32°F under ordinary conditions.
Water’s boiling temperature at sea level?|About 100°C or 212°F.
Daily high temperature?|The highest temperature recorded that day.
Daily low temperature?|The lowest temperature recorded that day.
How do you find temperature range?|High minus low: 75°F − 50°F = 25°F.
How do you average readings?|Add the readings and divide by their count.
What is precipitation?|Rain, snow, sleet, or hail falling from clouds.
What measures rainfall?|A rain gauge.
What is humidity?|The amount of water vapor in air.
Does 100% relative humidity mean rain?|No. It means air is saturated at its current temperature.
What is dew point?|The temperature air must cool to become saturated.
How do clouds form?|Water vapor condenses into droplets or forms ice crystals, often as rising air cools.
What is air pressure?|Force air exerts per unit area.
What measures air pressure?|A barometer.
What can falling pressure suggest?|An approaching system with clouds, wind, or precipitation.
What does high pressure often bring?|Clearer, drier weather; conditions vary.
What causes wind?|Differences in air pressure.
What measures wind speed?|An anemometer.
What does a wind vane measure?|The direction wind comes from.
What is wind chill?|How cold it feels as wind increases heat loss from exposed skin.
What is heat index?|How hot it feels when temperature and humidity are combined.
What is a cold front?|An advancing cold air mass replacing warmer air.
What is a warm front?|An advancing warm air mass replacing colder air.
What is a forecast?|A prediction based on observations and scientific models.
What is climate?|Long-term weather patterns, commonly described using 30 years of data.
Does one cold day show climate cooling?|No. Climate trends require many years of measurements.`);
add('Water facts',`Water’s chemical formula?|H₂O.
What atoms make a water molecule?|Two hydrogen atoms and one oxygen atom.
Water’s three states?|Solid ice, liquid water, and gaseous water vapor.
Fresh water’s freezing temperature?|About 0°C or 32°F at ordinary pressure.
Boiling temperature at sea level?|About 100°C or 212°F.
What is melting?|Ice becoming liquid water.
What is freezing?|Liquid water becoming ice.
What is evaporation?|Liquid water becoming vapor at its surface.
Must water boil to evaporate?|No. Evaporation happens below boiling temperature.
What is condensation?|Vapor becoming liquid droplets.
What is sublimation?|Ice becoming vapor directly.
Can you see water vapor?|No. Visible white mist is tiny liquid droplets.
What is the water cycle?|Water’s continuous movement between Earth’s surface and atmosphere.
What powers evaporation in the water cycle?|Energy from the Sun.
What is precipitation?|Rain, snow, sleet, or hail falling from clouds.
What is runoff?|Water flowing over land into streams, lakes, and oceans.
What is groundwater?|Water in spaces and cracks in soil and rock beneath the surface.
What is an aquifer?|Rock or sediment that stores and transmits groundwater.
What is transpiration?|Plants releasing water vapor, mainly through leaves.
How much of Earth’s surface is water?|About 71%.
How much of Earth’s water is salty?|About 97%; about 3% is fresh.
Where is most fresh water stored?|Ice sheets and glaciers.
Why does ice float?|It is less dense than liquid water.
What happens when water freezes?|Its volume expands.
What is surface tension?|Molecular attraction making the surface resist stretching or breaking.
What does dissolve mean?|Mix evenly into a liquid at the particle level.
Can water dissolve everything?|No. Oil, for example, does not dissolve in water.
What is desalination?|Removing dissolved salts from salt water.
Is clear water always safe to drink?|No. Invisible germs or harmful chemicals may be present.
Why do bodies need water?|To regulate temperature, transport nutrients, and remove waste.`);
decks["Fractions & decimals"]=[["What is an equivalent fraction?", "A fraction with the same value: 1/2 = 2/4."], ["How do you add fractions with the same denominator?", "Add numerators and keep the denominator: 2/7 + 3/7 = 5/7."], ["How do you add fractions with different denominators?", "Find a common denominator first: 1/2 + 1/3 = 3/6 + 2/6 = 5/6."], ["How do you multiply fractions?", "Multiply numerators and denominators: 2/3 \u00d7 3/4 = 6/12 = 1/2."], ["How do you divide by a nonzero fraction?", "Multiply by its reciprocal: 1/2 \u00f7 1/4 = 1/2 \u00d7 4 = 2."], ["What is a mixed number?", "A whole number plus a fraction: 2 1/3."], ["What is 0.75 as a fraction?", "3/4."], ["What is 1/5 as a decimal?", "0.2."], ["How do you add decimals?", "Align decimal points, then add."], ["Which is greater: 0.6 or 0.56?", "0.6, because 0.60 > 0.56."]];

const subject=document.getElementById('subject'),card=document.getElementById('card'),txt=document.getElementById('text'),side=document.getElementById('side'),hint=document.getElementById('hint'),flip=document.getElementById('flip');const groups={"Mathematics":["Algebra practice","Math terms","Measurement units","Metric → English","Fractions & decimals","Geometry","Percent & ratios"],"Science":["Periodic table","Science facts","Scientific results","Water facts","Weather & temperature","Human body","Space & astronomy"],"History":["History & civics"],"English":["Grammar & language","Reading & writing"],"Geography":["World geography"]};const level=document.getElementById('level');const extra={challenge:[["Mathematics", "Solve 3x + 7 = 28.", "x = 7."], ["Mathematics", "A $80 jacket is discounted 25%, then taxed 10%. Final price?", "$66."], ["Mathematics", "Find the slope through (2, 3) and (6, 11).", "2."], ["Mathematics", "A circle has radius 7 cm. What is its area?", "49π square cm."], ["Mathematics", "What is 3/4 divided by 2/5?", "15/8 or 1 7/8."], ["Mathematics", "Two dice are rolled. Probability of a sum of 7?", "1/6."], ["Science", "Why does ice float on liquid water?", "Its crystal structure makes it less dense than liquid water."], ["Science", "Why do seasons occur?", "Earth’s tilted axis changes sunlight angle and day length during its orbit."], ["Science", "What happens to acceleration if force doubles and mass stays constant?", "Acceleration doubles (F = ma)."], ["Science", "Why are antibiotics ineffective against viruses?", "Viruses lack the bacterial structures and processes antibiotics target."], ["Science", "How does natural selection change a population?", "Heritable traits that improve reproductive success tend to become more common."], ["Science", "Why does a metal spoon feel colder than wood at the same temperature?", "Metal conducts heat away from your hand faster."], ["History", "Why did the American colonists object to taxation without representation?", "They had no elected representatives in the British Parliament imposing those taxes."], ["History", "How did the printing press help spread the Reformation?", "It enabled religious arguments and translations to circulate widely and cheaply."], ["History", "What was the significance of the Magna Carta of 1215?", "It established that the English king was subject to certain legal limits."], ["History", "How did industrialization encourage urbanization?", "Factory jobs drew workers from rural areas into cities."], ["History", "What was a major purpose of the Marshall Plan?", "To support European economic recovery after World War II."], ["History", "How did the Thirteenth and Fourteenth Amendments differ?", "The Thirteenth abolished slavery except as punishment for crime; the Fourteenth established citizenship and equal protection guarantees."], ["English", "Identify the literary device: The wind whispered through the trees.", "Personification."], ["English", "Correct: Neither of the students were ready.", "Neither of the students was ready."], ["English", "What distinguishes dramatic irony from situational irony?", "Dramatic irony involves knowledge the audience has but a character lacks; situational irony involves an unexpected outcome."], ["English", "Identify the dependent clause: Although it rained, we played outside.", "Although it rained."], ["English", "What is the difference between denotation and connotation?", "Denotation is literal meaning; connotation is an associated feeling or idea."], ["English", "What makes a narrator unreliable?", "Reasons to doubt the accuracy or completeness of the narrator’s account."], ["Geography", "Why are many deserts found near 30 degrees latitude?", "Descending dry air in atmospheric circulation suppresses rainfall."], ["Geography", "Why do coastal areas often have milder temperatures?", "Water heats and cools more slowly than land."], ["Geography", "What is a rain shadow?", "A dry region on the leeward side of a mountain range."], ["Geography", "Why are earthquakes common around the Pacific Ring of Fire?", "Many tectonic plate boundaries surround the Pacific."], ["Geography", "What is the difference between latitude and longitude?", "Latitude measures north or south of the equator; longitude measures east or west of the prime meridian."], ["Geography", "Why can a map projection distort country sizes?", "A curved surface cannot be flattened without distortion."]],advanced:[["Mathematics", "Solve x² − 5x + 6 = 0.", "x = 2 or 3."], ["Mathematics", "Find the hypotenuse of a right triangle with legs 9 and 12.", "15."], ["Mathematics", "Simplify (2x³)(4x²).", "8x⁵."], ["Mathematics", "Solve 2x + y = 10 and x − y = 2.", "x = 4, y = 2."], ["Mathematics", "What is the vertex of y = (x − 3)² + 2?", "(3, 2)."], ["Science", "Why does increasing temperature often speed up a chemical reaction?", "More collisions have enough energy to overcome activation energy."], ["Science", "How do meiosis and fertilization maintain chromosome number?", "Meiosis halves it; fertilization restores the diploid number."], ["Science", "What is the difference between kinetic and potential energy?", "Kinetic energy is energy of motion; potential energy is stored due to position or configuration."], ["Science", "What is the pH of a solution with hydrogen ion concentration 10⁻³ M?", "3, approximately."], ["Science", "Why does a satellite in orbit not simply fall to Earth?", "It continually falls under gravity while moving sideways fast enough to keep missing Earth."], ["History", "How did the Treaty of Versailles contribute to instability in Germany?", "Reparations, territorial losses and political resentment contributed to instability, alongside other factors."], ["History", "What distinguished the Cold War from a direct war between superpowers?", "The US and USSR competed through alliances, arms races and proxy conflicts without direct full-scale war against each other."], ["History", "How did the Haitian Revolution challenge colonial systems?", "Enslaved people overthrew French colonial rule and established an independent state."], ["History", "What was the significance of Brown v. Board of Education?", "The US Supreme Court ruled racial segregation in public schools unconstitutional."], ["History", "Why should historians corroborate primary sources?", "Sources may be biased, incomplete or mistaken; comparison helps assess reliability."], ["English", "What is a syllogism?", "A deductive argument with premises leading to a conclusion."], ["English", "Identify the rhetorical device: We shall fight, we shall endure, we shall prevail.", "Anaphora: repetition at the beginning of successive clauses."], ["English", "What is a false dilemma?", "An argument that presents only two choices when more exist."], ["English", "What is the effect of an extended metaphor?", "It develops a comparison across multiple lines or passages to deepen meaning."], ["English", "What is a concessive clause?", "A clause acknowledging a contrasting circumstance, often introduced by although or even though."], ["Geography", "How does the Coriolis effect influence winds?", "Earth’s rotation deflects moving air right in the Northern Hemisphere and left in the Southern Hemisphere."], ["Geography", "Why can rapid urbanization strain infrastructure?", "Population growth may outpace housing, transport, water and sanitation capacity."], ["Geography", "How does a demographic transition typically affect population growth?", "Death rates fall before birth rates, accelerating growth temporarily; later falling birth rates slow growth."], ["Geography", "What is an exclusive economic zone?", "A maritime zone generally extending up to 200 nautical miles where a coastal state has specified resource rights."], ["Geography", "How can ocean currents affect regional climate?", "They redistribute heat, warming or cooling nearby coastal regions."]]};for(const name of ['All subjects',...Object.keys(groups)])subject.add(new Option(name,name));let list=[],i=0,back=false;function render(){document.getElementById("reward").hidden=!back;document.getElementById("wrong").hidden=!back;const r=list[i];txt.textContent=r[back?1:0];side.textContent=back?'Back · Answer':'Front · Question';hint.textContent=back?'Tap to see the question':'Think of your answer, then tap';card.classList.toggle('answer',back);flip.textContent=back?'Show question':'Show answer';card.setAttribute('aria-label',(back?'Answer: ':'Question: ')+r[back?1:0]+'. Tap to flip.');document.getElementById('count').textContent=`${i+1} / ${list.length}`;document.getElementById('category').textContent=r[2]||subject.value}function load(){const names=subject.value==='All subjects'?Object.keys(groups):[subject.value];const tier=Number(level.value)<=6?'standard':Number(level.value)<=8?'challenge':'advanced';list=tier==='standard'?names.flatMap(name=>groups[name].flatMap(deck=>(decks[deck]||[]).map(r=>[...r,deck]))):extra[tier].filter(r=>names.includes(r[0])).map(r=>[r[1],r[2],r[0]]);if(names.includes('Mathematics')){for(let j=1;j<=310;j++){let a=j+Number(level.value),b=2+j%11;let q=Number(level.value)<=4?[`${a} + ${b} = ?`,String(a+b)]:Number(level.value)<=6?[`${a} × ${b} = ?`,String(a*b)]:Number(level.value)<=8?[`Solve ${b}x + ${a} = ${b*(j+1)+a}.`,String(j+1)]:[`Find the positive root of x² = ${(j+1)**2}.`,String(j+1)];list.push([...q,'Mathematics practice'])}}document.getElementById('grade').textContent='GRADE '+level.value;i=0;back=false;render();updatePet()}level.onchange=load;function turn(){back=!back;render()}function move(n){i=(i+n+list.length)%list.length;back=false;render()}subject.onchange=load;card.onclick=flip.onclick=turn;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('shuffle').onclick=()=>{for(let j=list.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[list[j],list[k]]=[list[k],list[j]]}i=0;back=false;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'&&e.target===document.body){e.preventDefault();turn()}});
let celebrating=false;
const pets={4:['Rabbit','#c8b1a1'],5:['Red panda','#bc5637'],6:['Fox','#e88b43'],7:['Wolf','#8795a5'],8:['Snow leopard','#b9c4ce'],9:['Golden eagle','#94613b'],10:['Tiger','#e5a03d']};
let progress={};try{progress=JSON.parse(localStorage.getItem('flipV3Progress')||'{}')||{}}catch(e){};
function record(g){return progress[g]||(progress[g]={correct:[],review:[]})}function stage(n){return n>=300?3:n>=150?2:n>=50?1:0}const stages=['Baby','Juvenile','Young adult','Fully grown'];
function animal(g,n){const [name,c]=pets[g],t=stage(n),head= t===0?48:t===1?43:38,eye= t===0?10:7;let ears=g==4?`<ellipse cx="76" cy="39" rx="13" ry="36"/><ellipse cx="124" cy="39" rx="13" ry="36"/>`:g==5||g==8||g==10?`<circle cx="64" cy="56" r="19"/><circle cx="136" cy="56" r="19"/>`:g==9?'':`<path d="M55 79 L48 20 L91 56 M109 56 L152 20 L145 79"/>`;let marks=g==10?'<path d="M64 68l19 9m53 -9l-19 9M60 92l16 5m64 -5l-16 5M100 52v15" stroke="#493a32" stroke-width="6" stroke-linecap="round"/>':g==8?Array.from({length:9},(_,i)=>`<circle cx="${72+i%3*28}" cy="${65+Math.floor(i/3)*19}" r="4" fill="#66727d"/>`).join(''):'';return `<svg viewBox="0 0 200 200" role="img" aria-label="${stages[t]} ${name}"><ellipse cx="100" cy="183" rx="62" ry="8" fill="#294d4020"/><g fill="${c}" stroke="#554b45" stroke-width="2"><path d="M132 153 Q190 155 176 101 Q151 110 135 130"/><ellipse cx="100" cy="139" rx="${35+t*5}" ry="${32+t*4}"/>${ears}<ellipse cx="100" cy="92" rx="${head+5}" ry="${head}"/><ellipse cx="77" cy="171" rx="18" ry="11"/><ellipse cx="123" cy="171" rx="18" ry="11"/></g>${g==9?'<path d="M52 83Q100 35 148 83L132 116H68Z" fill="#d8bd79"/><path d="M88 106L112 106L100 126Z" fill="#e9ad36"/>':'<ellipse cx="100" cy="113" rx="30" ry="19" fill="#fff0d6"/><ellipse cx="100" cy="108" rx="8" ry="5" fill="#413b36"/>'}${marks}<g fill="#26383b"><ellipse cx="80" cy="88" rx="${eye}" ry="${eye+2}"/><ellipse cx="120" cy="88" rx="${eye}" ry="${eye+2}"/></g><g fill="white"><circle cx="77" cy="85" r="3"/><circle cx="117" cy="85" r="3"/></g>${g==9?'':'<path d="M93 119Q100 125 107 119" fill="none" stroke="#413b36" stroke-width="2"/>"'}</svg>`}
function updatePet(){let g=level.value,n=record(g).correct.length,t=stage(n),goal=[50,150,300,300][t];document.getElementById('petArt').innerHTML=animal(g,n);document.getElementById('petName').textContent=stages[t]+' '+pets[g][0];document.getElementById('petProgress').textContent=n+' unique correct answers · '+(t===3?'Fully grown!':goal+' to next stage');let bar=document.getElementById('growth');bar.max=goal;bar.value=n;}
function save(){try{localStorage.setItem('flipV3Progress',JSON.stringify(progress))}catch(e){}}
function key(){return list[i][0].trim().toLowerCase()}
document.getElementById('reward').onclick=()=>{if(!back||celebrating)return;celebrating=true;let g=level.value,r=record(g),old=stage(r.correct.length),k=key(),fresh=!r.correct.includes(k);if(fresh)r.correct.push(k);r.review=r.review.filter(x=>x!==k);save();updatePet();let n=r.correct.length;document.getElementById('fox').innerHTML=animal(g,n);document.getElementById('partyMessage').textContent=stage(n)>old?'Your animal has grown!':fresh?'Fantastic! +1 growth point':'Great practice!';document.getElementById('party').hidden=false;setTimeout(()=>{document.getElementById('party').hidden=true;celebrating=false;move(1)},1700)};
document.getElementById('wrong').onclick=()=>{let r=record(level.value),k=key();if(!r.review.includes(k))r.review.push(k);save();move(1)};
document.getElementById('sanctuary').onclick=()=>{document.getElementById('zooList').innerHTML=Object.keys(pets).map(g=>{let n=record(g).correct.length;return `<div class="animalTile">${animal(Number(g),n)}<strong>Grade ${g}: ${pets[g][0]}</strong><br>${stages[stage(n)]} · ${n} correct</div>`}).join('');document.getElementById('zoo').showModal()};document.getElementById('closeZoo').onclick=()=>document.getElementById('zoo').close();load();
