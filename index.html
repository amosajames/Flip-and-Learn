<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flip & Learn</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#223a35;font:17px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 22px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;letter-spacing:-1px;margin:0}.badge{font-size:12px;background:#e6eadb;padding:8px 12px;border-radius:30px}p{color:#68766e}label{font-size:12px;font-weight:700;letter-spacing:1.5px}select{display:block;width:100%;margin:10px 0 24px;border:1px solid #cbd1c5;border-radius:12px;background:white;padding:15px;color:#223a35;font:inherit}.meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;color:#68766e}#card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;width:100%;min-height:320px;padding:35px;border:1px solid #dae0d5;border-radius:24px;background:#fff;box-shadow:0 12px 35px #223a3509;color:inherit;cursor:pointer;transition:background .2s;text-align:center}#card.answer{background:#e4eddc}#side{text-transform:uppercase;font:700 11px system-ui;letter-spacing:2px;color:#688063}#text{font:500 clamp(23px,4vw,32px)/1.4 system-ui;max-width:560px}#hint{font:13px system-ui;color:#73816e}.nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:20px}button.control{border:1px solid #cbd1c5;border-radius:12px;background:transparent;color:#223a35;padding:15px 8px;font:600 15px system-ui;cursor:pointer}button.primary{background:#294d40;color:white;border-color:#294d40}button:focus-visible,select:focus-visible{outline:3px solid #d28c44;outline-offset:4px}footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px}footer button{font:14px system-ui;border:0;background:none;color:#365d4a;cursor:pointer;padding:10px}footer span{font-size:12px;color:#788176}@media(max-width:450px){main{padding-top:24px}.badge{font-size:10px}#card{min-height:350px;padding:24px}footer span{max-width:150px;text-align:right}}body{background:linear-gradient(145deg,#d8f3e5,#e7ddff);color:#25464a}main{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;padding: max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}#card{flex:1;min-height:240px;background:#fffdf5;border:3px solid #9bcdb7}#text{font-size:clamp(26px,5vw,48px);font-weight:750}#reward{background:#f9cf70;color:#3c3520;border:0;border-radius:16px;padding:14px;font:700 18px system-ui;margin-top:10px}#party{position:fixed;inset:0;background:#e5f7dbf5;display:grid;place-content:center;text-align:center;z-index:9;font-size:32px;font-weight:bold}#party[hidden],#reward[hidden]{display:none}#fox{width:190px;margin:auto;animation:dance .45s ease-in-out infinite alternate}@keyframes dance{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-30px) rotate(15deg)}}@media(prefers-reduced-motion:reduce){#fox{animation:none}} .selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selectors select{margin:6px 0 12px;padding:10px;font-size:15px}@media(max-width:380px){.selectors select{font-size:13px;padding:8px}} #petPanel{display:flex;align-items:center;gap:12px;background:#ffffffa8;border-radius:18px;padding:8px 14px;margin-bottom:10px}#petArt{width:88px;flex-shrink:0}#petArt svg,#fox svg{width:100%;display:block}.petInfo{flex:1;font-size:13px}progress{width:100%;accent-color:#39876b}#sanctuary,#wrong{border:0;background:transparent;color:#285b49;padding:8px;font:600 14px system-ui}#wrong[hidden]{display:none}dialog{border:0;border-radius:22px;max-width:90vw;width:500px;background:#fffdf5;color:#25464a}dialog::backdrop{background:#193a3677}.animals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.animalTile{text-align:center;background:#e6f2e8;border-radius:15px;padding:8px}.animalTile svg{width:90px;display:block;margin:auto}#fox{width:220px}#party{padding:20px}#partyMessage{font-size:24px} #reviewMode{border:0;background:none;color:#285b49;font:600 14px system-ui;padding:8px}#accuracy{font-size:12px}#petArt{width:110px}#fox{width:min(75vw,340px)}.animalTile svg{width:130px;max-width:100%}#fox[data-pet="4"]{animation:hop .4s infinite alternate}#fox[data-pet="5"]{animation:roll .65s infinite alternate}#fox[data-pet="7"]{animation:howl .6s infinite alternate}#fox[data-pet="8"]{animation:pounce .55s infinite alternate}#fox[data-pet="9"]{animation:soar .7s infinite alternate}#fox[data-pet="10"]{animation:stomp .4s infinite alternate}@keyframes hop{to{transform:translateY(-45px)}}@keyframes roll{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}@keyframes howl{to{transform:rotate(-18deg) scale(1.12)}}@keyframes pounce{to{transform:translate(25px,-35px) rotate(12deg)}}@keyframes soar{to{transform:translateY(-55px) scale(1.15)}}@keyframes stomp{to{transform:translateY(-10px) scale(1.12,.93)}}@media(prefers-reduced-motion:reduce){#party #fox{animation:none}} #dev{max-height:90dvh;overflow:auto}#devArt{width:min(100%,300px);margin:auto;background:radial-gradient(ellipse,#fff8dc,#d8eee2);border-radius:24px}#devArt svg{display:block;width:100%}#devCaption{text-align:center;font-weight:700;margin:12px}#dev button{margin:5px 0}#devGrid{margin:12px 0}#devArt.dancing{animation:var(--dance,dance) .5s infinite alternate}#fox[data-pet="11"]{animation:prowl .6s infinite alternate}#fox[data-pet="12"]{animation:spin .7s infinite alternate}#fox[data-pet="13"]{animation:roar .55s infinite alternate}#fox[data-pet="14"]{animation:dive .65s infinite alternate}#fox[data-pet="15"]{animation:rise .7s infinite alternate}@keyframes prowl{to{transform:translateX(25px) rotate(-8deg)}}@keyframes spin{to{transform:rotate(25deg) scale(1.08)}}@keyframes roar{to{transform:scale(1.15) rotate(-5deg)}}@keyframes dive{to{transform:translate(20px,-35px) rotate(18deg)}}@keyframes rise{to{transform:translateY(-35px) scale(1.12);filter:drop-shadow(0 0 18px orange)}}@media(prefers-reduced-motion:reduce){#devArt.dancing,#party #fox{animation:none}}</style></head><body><main><header><h1>Flip & Learn V6<span style="color:#c99452"> ✦</span></h1><span class="badge" id="grade">GRADES 5–6</span></header><p>Grow your knowledge. Raise your animal.</p><div class="selectors"><div><label for="subject">CHOOSE A SUBJECT</label><select id="subject"></select></div><div><label for="level">GRADE LEVEL</label><select id="level"><option value="4" >Grade 4</option><option value="5" >Grade 5</option><option value="6" selected>Grade 6</option><option value="7" >Grade 7</option><option value="8" >Grade 8</option><option value="9" >Grade 9</option><option value="10" >Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option><option value="13">University — Undergraduate</option><option value="14">University — Graduate</option><option value="15">Professional</option></select></div></div><section id="petPanel"><div id="petArt"></div><div class="petInfo"><strong id="petName"></strong><div id="petProgress"></div><progress id="growth" max="50" value="0"></progress><button id="sanctuary">Animal sanctuary</button><button id="reviewMode">Review mistakes</button><div id="accuracy"></div></div></section><div class="meta"><span id="category"></span><span id="count"></span></div><button id="card" aria-label="Show answer"><span id="side"></span><span id="text"></span><span id="hint"></span></button><div class="nav"><button class="control" id="prev">← Previous</button><button class="control primary" id="flip">Show answer</button><button class="control" id="next">Next →</button></div><button id="reward" hidden>I got it right! ★</button><button id="wrong" hidden>Practice this again</button><footer><button id="shuffle">⇄ Shuffle cards</button><span>Tap to flip · Arrow keys to browse</span></footer><button class="control" id="devOpen">Developer preview · artwork</button></main><dialog id="zoo"><h2>Your animal sanctuary</h2><div class="animals" id="zooList"></div><button class="control" id="closeZoo">Close</button></dialog><dialog id="dev"><h2>Character studio</h2><p>Preview only — learning progress is not changed.</p><label for="devPet">Animal</label><select id="devPet"></select><label for="devStage">Growth stage</label><select id="devStage"><option value="0">Baby</option><option value="50">Juvenile</option><option value="150">Young adult</option><option value="300">Fully grown</option></select><div id="devArt"></div><div id="devCaption" aria-live="polite"></div><button class="control" id="devDance">Play celebration</button> <button class="control" id="devGrow">Simulate growth</button> <button class="control" id="devAll">Show all 48</button><div id="devGrid" class="animals"></div><button class="control" id="devClose">Close preview</button></dialog><div id="party" hidden role="status"><div id="fox"></div><div id="partyMessage">Fantastic! ★</div></div><script>
const decks={};function add(name,rows){decks[name]=rows.trim().split('\n').map(r=>r.split('|'))}
add('Science facts',`What is the basic unit of living things?|A cell.
What is photosynthesis?|Plants use sunlight, water, and carbon dioxide to make sugar, releasing oxygen.
What do roots do?|Absorb water and minerals and anchor a plant.
What is a vertebrate?|An animal with a backbone.
What is an invertebrate?|An animal without a backbone.
What is an adaptation?|An inherited characteristic that helps an organism survive and reproduce.
What do lungs do?|Take in oxygen and remove carbon dioxide.
What does the heart do?|Pumps blood throughout the body.
What is an ecosystem?|Living things and their nonliving environment interacting.
What is a producer?|An organism that makes its own food.
What is a consumer?|An organism that gets energy by eating other organisms.
What is a decomposer?|An organism that breaks down dead material and waste.
What do food-chain arrows show?|The direction energy moves, from food to eater.
What is a food web?|A network of connected food chains.
What is a habitat?|The place an organism lives.
What powers most ecosystems?|The Sun.
What is matter?|Anything that has mass and takes up space.
What are three common states of matter?|Solid, liquid, and gas.
Mass versus weight?|Mass measures matter; weight measures gravity’s pull.
What is a physical change?|A change that does not make a new substance, such as melting ice.
What is a chemical change?|A change producing new substances, such as rusting.
What is conduction?|Heat transfer through direct contact.
What is a force?|A push or pull.
What is gravity?|Attraction between objects with mass.
What is friction?|A force resisting surfaces sliding past each other.
How do you find average speed?|Distance ÷ time.
What do balanced forces do?|Leave motion unchanged: still, or constant speed and direction.
What is an electrical conductor?|A material that lets current flow easily, such as copper.
What is an electrical insulator?|A material that resists current, such as rubber.
What does a simple circuit need?|An energy source and a closed conducting path.
What causes day and night?|Earth’s rotation.
What causes seasons?|Earth’s tilted axis as Earth orbits the Sun.
Why does the Moon show phases?|We see different amounts of its sunlit half as it orbits Earth.
What are the three main rock types?|Igneous, sedimentary, and metamorphic.
Weathering versus erosion?|Weathering breaks rock down; erosion moves it.
What are tectonic plates?|Slowly moving pieces of Earth’s rigid outer layer.`);

Feet in 1 yard?|3 feet.
Inches in 1 yard?|36 inches.
Feet in 1 mile?|5,280 feet.
Yards in 1 mile?|1,760 yards.
Millimeters in 1 centimeter?|10 millimeters.
Centimeters in 1 meter?|100 centimeters.
Millimeters in 1 meter?|1,000 millimeters.
Meters in 1 kilometer?|1,000 meters.
Ounces in 1 pound?|16 ounces.
Pounds in 1 U.S. ton?|2,000 pounds.
Milligrams in 1 gram?|1,000 milligrams.
Grams in 1 kilogram?|1,000 grams.
Teaspoons in 1 tablespoon?|3 teaspoons.
Tablespoons in 1 U.S. cup?|16 tablespoons.
Fluid ounces in 1 U.S. cup?|8 fluid ounces.
Cups in 1 U.S. pint?|2 cups.
Pints in 1 U.S. quart?|2 pints.
Quarts in 1 U.S. gallon?|4 quarts.
Cups in 1 U.S. gallon?|16 cups.
Milliliters in 1 liter?|1,000 milliliters.
Seconds in 1 minute?|60 seconds.
Minutes in 1 hour?|60 minutes.
Seconds in 1 hour?|3,600 seconds.
Hours in 1 day?|24 hours.
Days in 1 week?|7 days.
Months in 1 year?|12 months.
Days in a regular year?|365 days.
Days in a leap year?|366 days.
What units measure perimeter?|Length units, such as feet or meters.
What units measure area?|Square units, such as cm² or ft².
What units measure volume?|Cubic units, liters, or milliliters.
Square inches in 1 square foot?|144 square inches: 12 × 12.
Cubic centimeters in 1 milliliter?|1 cm³ = 1 mL.
Larger units to smaller units?|Multiply by the conversion factor.
Smaller units to larger units?|Divide by the conversion factor.
Ounce versus fluid ounce?|An ounce measures weight; a fluid ounce measures volume.`);

add('Periodic table',`What is the periodic table?|A chart organizing elements by atomic number.
What is an element?|A pure substance made of one type of atom.
What is an atom?|The smallest unit retaining an element’s chemical identity.
What does atomic number tell you?|The number of protons in an atom.
What is a chemical symbol?|A one- or two-letter abbreviation for an element.
What are horizontal rows called?|Periods.
What are vertical columns called?|Groups or families.
Why are elements in a group similar?|Their outer electron arrangements usually give them similar chemical properties.
Where are most metals?|On the left and in the center.
Where are most nonmetals?|On the right; hydrogen is on the left.
What are metalloids?|Elements with some metal and some nonmetal properties.
What are noble gases?|Group 18 elements, which usually react very little.`);
[['Hydrogen','H',1],['Helium','He',2],['Lithium','Li',3],['Carbon','C',6],['Nitrogen','N',7],['Oxygen','O',8],['Neon','Ne',10],['Sodium','Na',11],['Magnesium','Mg',12],['Aluminum','Al',13],['Silicon','Si',14],['Chlorine','Cl',17],['Potassium','K',19],['Calcium','Ca',20],['Iron','Fe',26],['Copper','Cu',29],['Silver','Ag',47],['Gold','Au',79]].forEach(([n,s,a])=>decks['Periodic table'].push([`${n}: symbol and atomic number?`,`${s} — atomic number ${a}.`]));
add('Algebra practice',`What is a solution?|A number that makes an equation true.
What is the main rule for solving equations?|Do the same operation to both sides.
What undoes addition?|Subtraction.
What undoes subtraction?|Addition.
What undoes multiplication?|Division by the same nonzero number.
What undoes division?|Multiplication by the same nonzero number.
Solve x + 5 = 12.|x = 7. Subtract 5 from both sides.
Solve x − 4 = 9.|x = 13. Add 4 to both sides.
Solve 3x = 18.|x = 6. Divide both sides by 3.
Solve x ÷ 4 = 5.|x = 20. Multiply both sides by 4.
Solve 2x + 4 = 14.|x = 5. Subtract 4, then divide by 2.
How do you check a solution?|Substitute it into the original equation and check both sides are equal.`);
add('Math terms',`Sum|The answer to addition: 4 + 3 = 7.
Difference|The answer to subtraction: 9 − 5 = 4.
Product|The answer to multiplication: 3 × 4 = 12.
Quotient|The answer to division: 12 ÷ 3 = 4.
Factor|A number multiplied by another to make a product. 3 and 4 are factors of 12.
Multiple|A number made by multiplying by a whole number: 5, 10, 15 are multiples of 5.
Remainder|The amount left in whole-number division: 14 ÷ 4 is 3 remainder 2.
Variable|A letter representing a number, such as x.
Constant|A fixed value: 3 in x + 3.
Coefficient|A number multiplying a variable: 5 in 5x.
Term|A part separated by addition or subtraction: 3x and 7 in 3x + 7.
Expression|Numbers, variables, or operations representing a value: 2x + 5.
Equation|A statement that two expressions are equal: 2x + 5 = 13.
Solution|A value making an equation true: x = 4 solves 2x + 5 = 13.
Evaluate|Find the value. If x = 3, then 2x + 1 = 7.
Inequality|A comparison using <, >, ≤, or ≥.
Equivalent|Having the same value: 1/2 and 2/4.
Inverse operations|Operations that undo each other.
Numerator|The top number in a fraction: 3 in 3/4.
Denominator|The bottom number: how many equal parts make one whole.
Percent|A number out of 100: 25% = 1/4.
Ratio|A comparison of quantities: 2 red to 3 blue is 2:3.
Prime number|A whole number greater than 1 with exactly two positive factors: 1 and itself.
Composite number|A whole number greater than 1 with more than two positive factors.
Exponent|Tells how many times to use a base as a factor: 2³ = 2 × 2 × 2.
Absolute value|Distance from zero: the absolute value of −5 is 5.
Distributive property|3(x + 2) = 3x + 6.
Commutative property|Changing order preserves a sum or product: 3 + 5 = 5 + 3.
Associative property|Changing grouping preserves a sum or product.
Order of operations|Parentheses, exponents, multiplication/division left to right, then addition/subtraction left to right.`);
add('Scientific results',`Scientific question|A question you can investigate with observations or experiments.
Hypothesis|A possible explanation that can be tested.
Prediction|What you expect to happen.
Experiment|A procedure testing a hypothesis or question.
Variable|Something that can change in an investigation.
Independent variable|The factor deliberately changed.
Dependent variable|The result measured.
Controlled variables|Factors kept the same.
Control group|A comparison group receiving standard conditions or no treatment.
Observation|Information gathered with senses or tools.
Measurement|A number and unit, such as 15 centimeters.
Data|Collected observations and measurements.
Qualitative data|Descriptions, such as color or texture.
Quantitative data|Numbers, such as height or time.
Results|What happened, shown through observations and data.
Graph|A visual display of data.
Trend|A general pattern in data.
Evidence|Data supporting or challenging an explanation.
Conclusion|An answer based on results.
Repeated trials|Performing a test more than once to check consistency.
Mean (average)|Add values and divide by the number of values.
Accuracy|Closeness to the true or accepted value.
Precision|Closeness of repeated measurements to each other.
Inference|An explanation based on observations and prior knowledge.
Do results prove a hypothesis forever?|No. Results can support or fail to support it; one experiment does not establish it for all situations.`);
add('Weather & temperature',`What is weather?|Atmospheric conditions at a place and time.
What is temperature?|A measure of how hot or cold something is.
What measures temperature?|A thermometer.
Common temperature scales?|Celsius (°C) and Fahrenheit (°F).
Water’s freezing temperature?|About 0°C or 32°F under ordinary conditions.
Water’s boiling temperature at sea level?|About 100°C or 212°F.
Daily high temperature?|The highest temperature recorded that day.
Daily low temperature?|The lowest temperature recorded that day.
How do you find temperature range?|High minus low: 75°F − 50°F = 25°F.
How do you average readings?|Add the readings and divide by their count.
What is precipitation?|Rain, snow, sleet, or hail falling from clouds.
What measures rainfall?|A rain gauge.
What is humidity?|The amount of water vapor in air.
Does 100% relative humidity mean rain?|No. It means air is saturated at its current temperature.
What is dew point?|The temperature air must cool to become saturated.
How do clouds form?|Water vapor condenses into droplets or forms ice crystals, often as rising air cools.
What is air pressure?|Force air exerts per unit area.
What measures air pressure?|A barometer.
What can falling pressure suggest?|An approaching system with clouds, wind, or precipitation.
What does high pressure often bring?|Clearer, drier weather; conditions vary.
What causes wind?|Differences in air pressure.
What measures wind speed?|An anemometer.
What does a wind vane measure?|The direction wind comes from.
What is wind chill?|How cold it feels as wind increases heat loss from exposed skin.
What is heat index?|How hot it feels when temperature and humidity are combined.
What is a cold front?|An advancing cold air mass replacing warmer air.
What is a warm front?|An advancing warm air mass replacing colder air.
What is a forecast?|A prediction based on observations and scientific models.
What is climate?|Long-term weather patterns, commonly described using 30 years of data.
Does one cold day show climate cooling?|No. Climate trends require many years of measurements.`);
add('Water facts',`Water’s chemical formula?|H₂O.
What atoms make a water molecule?|Two hydrogen atoms and one oxygen atom.
Water’s three states?|Solid ice, liquid water, and gaseous water vapor.
Fresh water’s freezing temperature?|About 0°C or 32°F at ordinary pressure.
Boiling temperature at sea level?|About 100°C or 212°F.
What is melting?|Ice becoming liquid water.
What is freezing?|Liquid water becoming ice.
What is evaporation?|Liquid water becoming vapor at its surface.
Must water boil to evaporate?|No. Evaporation happens below boiling temperature.
What is condensation?|Vapor becoming liquid droplets.
What is sublimation?|Ice becoming vapor directly.
Can you see water vapor?|No. Visible white mist is tiny liquid droplets.
What is the water cycle?|Water’s continuous movement between Earth’s surface and atmosphere.
What powers evaporation in the water cycle?|Energy from the Sun.
What is precipitation?|Rain, snow, sleet, or hail falling from clouds.
What is runoff?|Water flowing over land into streams, lakes, and oceans.
What is groundwater?|Water in spaces and cracks in soil and rock beneath the surface.
What is an aquifer?|Rock or sediment that stores and transmits groundwater.
What is transpiration?|Plants releasing water vapor, mainly through leaves.
How much of Earth’s surface is water?|About 71%.
How much of Earth’s water is salty?|About 97%; about 3% is fresh.
Where is most fresh water stored?|Ice sheets and glaciers.
Why does ice float?|It is less dense than liquid water.
What happens when water freezes?|Its volume expands.
What is surface tension?|Molecular attraction making the surface resist stretching or breaking.
What does dissolve mean?|Mix evenly into a liquid at the particle level.
Can water dissolve everything?|No. Oil, for example, does not dissolve in water.
What is desalination?|Removing dissolved salts from salt water.
Is clear water always safe to drink?|No. Invisible germs or harmful chemicals may be present.
Why do bodies need water?|To regulate temperature, transport nutrients, and remove waste.`);

k?", "Processes wait indefinitely for resources held by one another."]], "Advanced mathematics": [["What is the derivative of ln x for x > 0?", "1/x."], ["What does the rank-nullity theorem state?", "dim(domain) = rank + nullity."], ["What is the general solution of y′ = ky?", "y = Ce^(kx)."], ["What is a necessary condition for a differentiable convex function to have an unconstrained minimum?", "Its gradient is zero; for convex functions this is also sufficient."], ["What does uniform convergence preserve for continuous functions?", "Continuity of the limit."]], "Biological sciences": [["What is the role of ATP synthase?", "It couples ion flow down an electrochemical gradient to ATP synthesis."], ["What is competitive inhibition in ideal Michaelis–Menten kinetics?", "Apparent Km increases; Vmax is unchanged."], ["What is genetic drift?", "Random changes in allele frequencies."], ["What is the purpose of a negative control?", "To detect background effects or contamination in the absence of the tested factor."], ["What is allosteric regulation?", "Binding at a regulatory site changes protein activity."]], "Business and economics": [["What is net present value?", "Sum of discounted future cash flows minus initial investment."], ["What is marginal cost?", "Change in total cost per additional unit of output."], ["What is opportunity cost?", "Value of the best forgone alternative."], ["What is the difference between nominal and real interest rates?", "Real rates adjust nominal rates for inflation."], ["What is adverse selection?", "Hidden information before a transaction causes selection bias in participants."]], "History": [["What is historiography?", "Study of how history is written and interpreted."], ["What is source provenance?", "The origin, authorship and transmission history of a source."]], "English": [["What is focalization in narrative theory?", "The perspective through which narrative information is filtered."], ["What is intertextuality?", "Relationships be const legalBanks={"Law · Constitutional law": [["What does judicial review mean in U.S. constitutional law?", "Courts may assess whether government action is consistent with the Constitution."], ["What is the distinction between procedural and substantive due process?", "Procedural due process concerns fair procedures; substantive due process concerns certain limits on government action itself."], ["What is federalism?", "The constitutional allocation of authority between federal and state governments."], ["A city restricts speech solely because officials dislike its viewpoint. What issue arises?", "Viewpoint discrimination under the First Amendment; such restrictions are generally unconstitutional, subject to context."]], "Law · Criminal law": [["What are actus reus and mens rea?", "The prohibited act or omission and the required mental state, respectively."], ["What is the prosecution's burden at a criminal trial?", "Proof beyond a reasonable doubt of each element of the charged offense."], ["How does an attempt differ from a completed offense?", "Attempt generally requires the requisite intent and conduct sufficiently advancing the crime; tests vary by jurisdiction."], ["Why distinguish motive from intent?", "Motive explains why someone acts; intent concerns the mental state required by the offense."]], "Law · Civil law": [["What is the usual burden of proof in ordinary U.S. civil litigation?", "Preponderance of the evidence, subject to exceptions."], ["What is an injunction?", "A court order requiring or prohibiting specified conduct."], ["What distinguishes compensatory and punitive damages?", "Compensatory damages address loss; punitive damages punish and deter qualifying misconduct where permitted."]], "Law · Contract law": [["What is consideration under traditional U.S. common law?", "A bargained-for exchange of legal value."], ["A buyer accepts an offer but materially changes its terms in a common-law transaction. What is the usual effect?", "A counteroffer rather than acceptance, subject to exceptions and applicable law."], ["What is the general purpose of expectation damages?", "To place the injured party in the position performance would have produced, subject to limitations."], ["What is mitigation of damages?", "The injured party generally cannot recover losses reasonably avoidable without undue burden or risk."]], "Law · Tort law": [["What are the usual elements of negligence?", "Duty, breach, factual and legal causation, and damages."], ["A driver runs a red light but causes no injury. Is ordinary negligence liability established solely by that fact?", "No. A negligence claim generally also requires causation and legally recognized harm."], ["What is comparative negligence?", "A system allocating responsibility for harm based on fault; rules vary by state."]], "Law · Property law": [["What is an easement?", "A nonpossessory right to use another person's land for a specified purpose."], ["What is a fee simple absolute?", "An estate of potentially indefinite duration with broad ownership rights."], ["What is adverse possession?", "Acquisition of title through possession satisfying statutory and common-law requirements, which vary by state."]], "Law · Corporate law": [["What is limited liability?", "Owners generally are not personally liable for entity debts solely because of ownership, subject to exceptions."], ["What is a fiduciary duty of loyalty?", "An obligation to act loyally for the beneficiary or entity rather than improperly favor personal interests."], ["What is the business judgment rule?", "A doctrine generally protecting qualifying informed, good-faith business decisions from judicial second-guessing; details vary."]], "Law · International law": [["What is a treaty?", "An international agreement governed by international law between parties with treaty-making capacity."], ["What is customary international law?", "General practice accepted as law (opinio juris)."], ["What is the distinction between jurisdiction to prescribe and enforce?", "Authority to make applicable rules versus authority to compel compliance."]], "Law · Evidence": [["Under the U.S. Federal Rules of Evidence, what is hearsay?", "An out-of-court statement offered to prove the truth of the matter asserted, subject to exclusions and exceptions."], ["What is relevance under Federal Rule of Evidence 401?", "Evidence tending to make a consequential fact more or less probable."], ["What does Federal Rule of Evidence 403 permit?", "Exclusion of relevant evidence when its probative value is substantially outweighed by specified dangers or considerations."]], "Law · Civil procedure": [["What is subject-matter jurisdiction?", "A court's authority to hear the type of dispute presented."], ["What is personal jurisdiction?", "A court's authority over a party, subject to applicable law and constitutional limits."], ["What is summary judgment under federal civil procedure?", "Judgment where no genuine dispute of material fact exists and the movant is entitled to judgment as a matter of law."]], "Law · Intellectual property": [["Does U.S. copyright protect ideas themselves?", "No. It protects qualifying original expression, not ideas themselves."], ["What is the basic function of a trademark?", "To identify and distinguish the source of goods or services."], ["What does a U.S. patent generally grant?", "A limited right to exclude others from specified uses of the claimed invention, not necessarily a right to practice it."]], "Law · Legal ethics": [["How does attorney-client privilege differ from professional confidentiality?", "Privilege concerns protected communications in legal proceedings; ethical confidentiality generally covers a broader range of representation-related information."], ["What is a conflict of interest?", "A situation in which competing duties or interests create a risk of impaired representation; applicable rules determine consent and prohibition."], ["May a lawyer knowingly offer false evidence?", "Generally no; duties of candor and remedial obligations depend on applicable professional rules."]]};
Object.assign(universityBanks,legalBanks);
universityBanks["Law and legal studies"]=Object.values(legalBanks).flat();
const schoolSubjects=['All subjects',...Object.keys(groups)];
function syncSubjects(){let old=subject.value;let options=Number(level.value)>=13?['All subjects',...Object.keys(universityBanks)]:schoolSubjects;subject.replaceChildren(...options.map(n=>new Option(n,n)));if(options.includes(old))subject.value=old;}
const oldLoad=load;load=function(){if(Number(level.value)<=10){oldLoad();return;}let g=Number(level.value);let names=subject.value==='All subjects'?(g>=13?Object.keys(universityBanks).filter(n=>n!=="Law and legal studies"):Object.keys(groups)):[subject.value];list=[];for(let name of names){let bank=universityBanks[name]||[];list.push(...bank.map(r=>[...r,name]));if(g<=12)list.push(...extra.advanced.filter(r=>r[0]===name).map(r=>[r[1],r[2],r[0]]));for(let j=1;j<=60;j++){let a=j+2,b=j%8+2;let q=null;if(name==='Mathematics'||name==='Advanced mathematics')q=g===11?[`Find the derivative of ${a}x² + ${b}x.`,` ${2*a}x + ${b}`]:g===12?[`Evaluate the integral of ${a}x from 0 to ${b}.`,String(a*b*b/2)]:[`Find the eigenvalues of the diagonal matrix diag(${a}, ${b}).`,`${a}, ${b}`];if(name==='Mechanical engineering')q=[`An ideal Carnot engine operates between ${400+10*j} K and 300 K. Find its maximum efficiency.`,`${(100*(1-300/(400+10*j))).toFixed(2)}% (1 − Tc/Th)`];if(name==='Civil engineering')q=[`A simply supported beam of span ${b} m carries a central point load of ${a} kN. Find maximum bending moment.`,`${a*b/4} kN·m (PL/4)`];if(name==='Electrical engineering')q=[`A ${a} Ω resistor carries ${b} A DC. Find power dissipated.`,`${a*b*b} W (I²R)`];if(name==='Aerospace engineering')q=[`Air density is 1.2 kg/m³ and airspeed is ${a*5} m/s. Find dynamic pressure.`,`${(0.6*(a*5)**2).toFixed(1)} Pa (½ρV²)`];if(name==='Chemical engineering')q=[`A feed of ${a*10} mol/s undergoes ${b*10}% conversion of reactant A. Find A consumed per second.`,`${a*b} mol/s`];if(name==='Business and economics')q=[`Revenue is $${a*100} and total cost is $${b*50}. Find profit.`,`$${a*100-b*50}`];if(q)list.push([...q,name+' · practice']);}}document.getElementById('grade').textContent=g<=12?'GRADE '+g:({13:'UNDERGRADUATE',14:'GRADUATE',15:'PROFESSIONAL'})[g];i=0;back=false;render();updatePet();};level.onchange=()=>{syncSubjects();load()};subject.onchange=load;
load();

const priorSync=syncSubjects;syncSubjects=function(){let previous=subject.value;priorSync();for(const n of ['Physics','Coding'])subject.add(new Option(n,n));if(previous==='Physics'||previous==='Coding')subject.value=previous;};
const priorLoadPC=load;load=function(){const g=level.value,n=subject.value;const bank=pcBanks[g];if(!bank){priorLoadPC();return;}const make=(name)=>{let rows=bank[name].map(r=>[...r,name]);if(name==='Physics'&&Number(g)<=12){for(let j=1;j<=30;j++){let a=j+2,b=j%7+2;let q=Number(g)<=6?[`A toy travels ${a*b} meters in ${b} seconds. Average speed?`,`${a} m/s`]:Number(g)<=9?[`A ${a} kg object accelerates at ${b} m/s². Net force?`,`${a*b} N (F = ma)`]:[`A ${a} Ω ohmic resistor carries ${b} A. Voltage?`,`${a*b} V (V = IR)`];rows.push([...q,name+' · practice']);}}return rows;};if(n==='Physics'||n==='Coding'){list=make(n);}else{priorLoadPC();if(n!=='All subjects')return;list.push(...make('Physics'),...make('Coding'));}document.getElementById('grade').textContent=Number(g)<=12?'GRADE '+g:({13:'UNDERGRADUATE',14:'GRADUATE',15:'PROFESSIONAL'})[g];i=0;back=false;render();updatePet();};
level.onchange=()=>{syncSubjects();load()};subject.onchange=load;syncSubjects();load();
